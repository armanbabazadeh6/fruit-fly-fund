<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fly vs. Fly — trading floor harness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #06090d; color: #e8eef6; font: 14px/1.5 ui-monospace, Menlo, monospace; }
      header { padding: 12px 16px; border-bottom: 1px solid #1b2734; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; }
      button, select { background: #121b25; color: inherit; border: 1px solid #28394c; border-radius: 6px; padding: 4px 8px; font: inherit; }
      #stage { height: 620px; margin: 12px; border: 1px solid #1b2734; border-radius: 10px; overflow: hidden; background: #070b11; }
      #status { margin: 0 16px 16px; color: #8a9db2; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>3D floor harness</h1>
      <label>recording <select id="recording"></select></label>
      <label>bar <input id="bar" type="number" value="0" min="0" style="width: 5em" /></label>
      <button id="play">play</button>
      <button id="moods">cycle moods</button>
      <span id="stats"></span>
    </header>
    <div id="stage"></div>
    <p id="status">loading…</p>
    <script type="module" src="/src/floor-check.ts"></script>
  </body>
</html>

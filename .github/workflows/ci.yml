name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No MaleCNS dataset here on purpose: the 1.1 GB connectome is downloaded locally by
      # `flyvsly prepare`, and the tests that need it skip themselves. Everything else —
      # fairness, execution parity, market seasons, the recorded-ledger reconciliation —
      # runs against synthetic seasons and the recordings committed in web/public.
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
